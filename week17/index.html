<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="module" src="./main.js"></script>
        <style>
            body {
                margin: 0;
            }
            /*
             * z-order layering (знизу вгору):
             *   0 (default) — canvas WebGL-рендерера
             *   1001        — UARButton (AR-кнопка)
             *   9999        — item-buttons (кнопки вибору моделі)
             *   9999        — confirm-buttons (кнопки підтвердження/скасування)
             */
            #item-buttons, #confirm-buttons {
                position: absolute;
                top: 50px;
                z-index: 9999;
                display: flex;
                flex-direction: row;
                display: none;
            }
            #item-buttons {
                left: 10px;
            }
            #confirm-buttons {
                right: 10px;
            }
            .button-image {
                width: 50px;
                height: 50px;
                object-fit: cover;
                margin: 5px;
                cursor: pointer;
                border: 2px solid transparent;
                border-radius: 8px;
                transition: border-color 0.2s;
            }
            .button-image:hover {
                border-color: #667eea;
            }
            .button {
                width: 50px;
                height: 50px;
                margin: 5px;
                cursor: pointer;
                font-size: 16px;
                font-weight: bold;
                border: 2px solid #fff;
                border-radius: 8px;
                color: #fff;
                transition: transform 0.2s;
            }
            .button:hover {
                transform: scale(1.1);
            }
            #place {
                background: #4caf50;
            }
            #cancel {
                background: #f44336;
            }
        </style>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
                "webxr/UARButton": "../lib/webxr/UARButton.js"
            }
        }
        </script>
    </head>
    <body>
        <div id="item-buttons">
            <img class="button-image" id="item0" src="../assets/teacup.glb" alt="teacup" title="teacup"/>
            <img class="button-image" id="item1" src="../assets/phoenix_bird.glb" alt="phoenix bird" title="phoenix bird"/>
            <img class="button-image" id="item2" src="../assets/sea_ship.glb" alt="sea ship" title="sea ship"/>
            <img class="button-image" id="item3" src="../assets/smol_ame_in_an_upcycled_terrarium_hololiveen.glb" alt="terrarium" title="terrarium"/>
        </div>
        <div id="confirm-buttons">
            <button class="button" id="place">OK</button>
            <button class="button" id="cancel">X</button>
        </div>
    </body>
</html>
